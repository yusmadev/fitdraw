<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3B4CCA" />
    <meta name="description" content="Créez des croquis de mesures de vêtements et exportez des images PNG nettes pour vos annonces. Gratuit, sans compte, vos données restent dans votre navigateur." />
    <meta name="application-name" content="FitDraw" />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FitDraw — croquis de mesures pour vos annonces" />
    <meta property="og:description" content="Mesurez à plat, visualisez et exportez un croquis PNG prêt à publier." />
    <title>FitDraw — croquis de mesures pour vos annonces</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FitDraw" />
    <script>
      try {
        var t = localStorage.getItem('fitdraw-theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark');
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
